<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="/user/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Fill Tool</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">Fill Tool</div>
    <h2>登录</h2>
    <form id="loginForm" class="auth-form" novalidate>
      <div class="field">
        <label>手机号或邮箱</label>
        <input class="input" id="ident" placeholder="请输入注册时的手机号 / 邮箱" autocomplete="username" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary" id="submitBtn" type="submit">登 录</button>
      <div class="auth-foot auth-foot--center">
        <a href="#" id="forgotLink">找回密码</a>
        <a href="/user/register.html">立即注册</a>
      </div>
    </form>
  </div>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
