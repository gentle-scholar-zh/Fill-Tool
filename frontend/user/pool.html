<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板填写 - 填表平台</title>
<link rel="stylesheet" href="/user/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>模板填写</h1>
      <p>选择一个公开模板，即可直接填写提交</p>
    </div>
    <div class="ptoolbar">
      <select id="tplSelect"><option value="">— 请选择模板 —</option></select>
      <button class="btn btn--ghost" id="btnCenter" type="button" style="width:auto;margin:0;padding:9px 14px;font-size:13px">我的</button>
    </div>
    <div id="banner"></div>
    <div id="formArea"><div class="pool-empty">请先在上方选择一个模板</div></div>
  </div>
  <div id="changelog"></div>
</div>
<script type="module" src="/user/js/pool.js"></script>
</body>
</html>
