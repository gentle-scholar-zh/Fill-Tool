<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公开模板池 - 填表平台</title>
<link rel="stylesheet" href="/user/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hero">
      <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h6M9 19h4"/></svg></div>
      <div class="hero-row">
        <h1>公开模板池</h1>
        <button class="btn btn--ghost btn--xs" id="btnCenter" type="button">我的</button>
      </div>
      <p>选择一个公开模板，即可直接在线填写与提交</p>
    </div>

    <div class="ptoolbar" style="margin-top:16px">
      <select id="tplSelect"><option value="">— 请选择模板 —</option></select>
    </div>
    <div id="banner"></div>
    <div id="formArea"><div class="pool-empty">请先在上方选择一个模板</div></div>
  </div>
  <div id="changelog"></div>
</div>
<script type="module" src="/user/js/pool.js"></script>
</body>
</html>
